name: Task 1 RED

on:
  push:
    branches:
      - feat/pesmad-app-v1
  pull_request:
    branches:
      - main

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Run shell behavior test
        run: npm test -- tests/smoke/app-shell.test.tsx
