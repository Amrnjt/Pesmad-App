name: Pesmad App Auth Browser

on:
  push:
    branches:
      - feat/pesmad-app-v1
      - feat/pesmad-login-dashboard-v2
    paths:
      - 'src/app/api/auth/**'
      - 'src/components/auth/**'
      - 'src/app/login/**'
      - 'src/lib/auth/**'
      - 'src/proxy.ts'
      - 'e2e/auth.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/auth-e2e.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/api/auth/**'
      - 'src/components/auth/**'
      - 'src/app/login/**'
      - 'src/app/dashboard/**'
      - 'src/components/dashboard/**'
      - 'src/proxy.ts'
      - 'e2e/auth.spec.ts'
      - 'playwright.config.ts'
      - '.github/workflows/auth-e2e.yml'

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run auth browser tests
        run: npm run test:e2e -- e2e/auth.spec.ts
